<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (007 Tuxedo Onyx & Midnight Slate) -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080B"/>
      <stop offset="50%" stop-color="#0F131C"/>
      <stop offset="100%" stop-color="#050709"/>
    </linearGradient>

    <!-- Animated Holographic 007 Gold-Red Gradient -->
    <linearGradient id="holoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755">
        <animate attributeName="stop-color" values="#E2B755;#D31427;#F5CE7A;#D31427;#E2B755" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#D31427">
        <animate attributeName="stop-color" values="#D31427;#F5CE7A;#E2B755;#F5CE7A;#D31427" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F5CE7A">
        <animate attributeName="stop-color" values="#F5CE7A;#E2B755;#D31427;#E2B755;#F5CE7A" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#D31427">
        <animate attributeName="stop-color" values="#D31427;#E2B755;#F5CE7A;#E2B755;#D31427" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#E2B755">
        <animate attributeName="stop-color" values="#E2B755;#D31427;#F5CE7A;#D31427;#E2B755" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2B755">
        <animate attributeName="stop-color" values="#E2B755;#FFF2CE;#E2B755" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FCE59F"/>
    </linearGradient>

    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FFFFFF" stroke-width="0.4" stroke-opacity="0.04"/>
      <circle cx="10" cy="10" r="0.5" fill="#E2B755" fill-opacity="0.08"/>
    </pattern>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .id-head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .id-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 700; }
  </style>

  <!-- Frame Background -->
  <rect width="1200" height="480" rx="16" fill="url(#cardBg)"/>
  <rect width="1200" height="480" rx="16" fill="url(#cardGrid)"/>
  
  <!-- Outer Holographic Border with Dash Flow Animation -->
  <rect x="12" y="12" width="1176" height="456" rx="12" fill="none" stroke="url(#holoBorder)" stroke-width="1.8" stroke-dasharray="16 10">
    <animate attributeName="stroke-dashoffset" values="0;260" dur="16s" repeatCount="indefinite"/>
  </rect>

  <!-- LEFT SIDE: 007 CLASSIFIED SHIELD & GUN-BARREL MONOGRAM -->
  <g transform="translate(48, 50)">
    <!-- Avatar / Shield Box -->
    <rect width="280" height="380" rx="12" fill="#0A0D14" stroke="#222B3D" stroke-width="1.2"/>
    
    <!-- Top Crimson Header on Shield with Animated Pulse -->
    <rect x="0" y="0" width="280" height="4" rx="2" fill="#D31427">
      <animate attributeName="fill" values="#D31427;#FF3B50;#D31427" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- 007 ROTATING GUN-BARREL SPIRAL CREST -->
    <g transform="translate(140, 150)">
      <!-- 007 Gun Barrel Spiral Rifling Blades -->
      <g stroke="#D31427" stroke-width="1.2" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <path d="M 0,-85 C 25,-75 55,-60 70,-40" fill="none"/>
        <path d="M 70,-40 C 80,-15 85,15 75,45" fill="none"/>
        <path d="M 75,45 C 60,70 30,80 0,85" fill="none"/>
        <path d="M 0,85 C -30,80 -60,65 -75,40" fill="none"/>
        <path d="M -75,40 C -85,15 -80,-20 -65,-50" fill="none"/>
        <path d="M -65,-50 C -45,-70 -20,-80 0,-85" fill="none"/>
      </g>

      <!-- Outer Rotating Gold Ring -->
      <circle cx="0" cy="0" r="88" fill="none" stroke="#E2B755" stroke-width="1" stroke-dasharray="8 6" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
      </circle>

      <!-- Crosshair Reticle Center -->
      <line x1="-30" y1="0" x2="-14" y2="0" stroke="#FF4D61" stroke-width="1.5"/>
      <line x1="14" y1="0" x2="30" y2="0" stroke="#FF4D61" stroke-width="1.5"/>
      <line x1="0" y1="-30" x2="0" y2="-14" stroke="#FF4D61" stroke-width="1.5"/>
      <line x1="0" y1="14" x2="0" y2="30" stroke="#FF4D61" stroke-width="1.5"/>

      <!-- Core Disc with Subtle Breathing Stroke -->
      <circle cx="0" cy="0" r="54" fill="#120A10" stroke="#E2B755" stroke-width="1.5">
        <animate attributeName="stroke" values="#E2B755;#D31427;#E2B755" dur="4s" repeatCount="indefinite"/>
      </circle>

      <!-- Monogram Initial VM -->
      <text x="0" y="14" text-anchor="middle" fill="url(#goldSheen)" class="id-head" font-size="42" letter-spacing="2">VM</text>
    </g>

    <!-- 007 Agent Cap Badge with Pulsing Live Green LED & VK18 Easter Egg -->
    <g transform="translate(24, 270)">
      <rect width="232" height="36" rx="6" fill="#141926" stroke="#253046" stroke-width="1"/>
      <text x="12" y="23" fill="#E2B755" class="id-mono" font-size="10.5" letter-spacing="1.2">AGENT 007 // #18 // CAP #01</text>
      
      <!-- Live Animated Beacon -->
      <circle cx="212" cy="18" r="4" fill="#00E676">
        <animate attributeName="r" values="3.5;6.5;3.5" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Clearance Level (007 Double-O Status) -->
    <g transform="translate(24, 320)">
      <text x="0" y="14" fill="#64748B" class="id-mono" font-size="9" letter-spacing="1.5">CLEARANCE LEVEL</text>
      <text x="0" y="32" fill="#FFFFFF" class="id-mono" font-size="12">DOUBLE-O SECTION // Q-BRANCH</text>
    </g>
  </g>

  <!-- RIGHT SIDE: OFFICIAL 007 DOSSIER -->
  <g transform="translate(365, 50)">
    <!-- Header Badges: Classified & 007 Status -->
    <rect width="210" height="26" rx="4" fill="#1F1117" stroke="#D31427" stroke-width="1"/>
    <text x="14" y="17" fill="#FF4D61" class="id-mono" font-size="10" letter-spacing="2">CLASSIFIED // EYES ONLY</text>
    <text x="545" y="18" fill="#5A667E" class="id-mono" font-size="11">OPERATION: PRODUCTION CLOUD</text>

    <!-- Name & Title with 007 Code -->
    <text x="0" y="70" fill="#FFFFFF" class="id-head" font-size="34">VANDAN MAHAJAN</text>
    <text x="0" y="96" fill="#E2B755" class="id-mono" font-size="14" letter-spacing="2">
      ROLE: SOFTWARE ENGINEER · AGENT 007 // SYSTEMS × PRODUCT × AI
    </text>

    <!-- Animated Divider Line with Laser Dot -->
    <line x1="0" y1="115" x2="780" y2="115" stroke="#1F283B" stroke-width="1"/>
    <circle cx="0" cy="115" r="3" fill="#D31427">
      <animate attributeName="cx" values="0;780;0" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- 4 FIELD ATTRIBUTES TABLE -->
    <!-- Attrib 1: Core Discipline -->
    <g transform="translate(0, 135)">
      <rect width="375" height="68" rx="8" fill="#0D111A" stroke="#1D2436" stroke-width="1"/>
      <text x="18" y="24" fill="#64748B" class="id-mono" font-size="10" letter-spacing="1.5">Q-BRANCH CORE SPECIALTY</text>
      <text x="18" y="48" fill="#FFFFFF" class="id-mono" font-size="13">Java · Distributed Systems · Concurrency</text>
      <path d="M 0 0 L 0 68" stroke="#D31427" stroke-width="3"/>
    </g>

    <!-- Attrib 2: Intelligence Suite -->
    <g transform="translate(400, 135)">
      <rect width="380" height="68" rx="8" fill="#0D111A" stroke="#1D2436" stroke-width="1"/>
      <text x="18" y="24" fill="#64748B" class="id-mono" font-size="10" letter-spacing="1.5">INTELLIGENCE SUITE</text>
      <text x="18" y="48" fill="#FFFFFF" class="id-mono" font-size="13">Hybrid RAG · Vector DBs · Local LLMs</text>
      <path d="M 0 0 L 0 68" stroke="#E2B755" stroke-width="3"/>
    </g>

    <!-- Attrib 3: Playing Philosophy -->
    <g transform="translate(0, 220)">
      <rect width="375" height="68" rx="8" fill="#0D111A" stroke="#1D2436" stroke-width="1"/>
      <text x="18" y="24" fill="#64748B" class="id-mono" font-size="10" letter-spacing="1.5">OPERATIONAL PHILOSOPHY</text>
      <text x="18" y="48" fill="#E2B755" class="id-mono" font-size="13">Logic × Common Sense × First Principles</text>
      <path d="M 0 0 L 0 68" stroke="#E2B755" stroke-width="3"/>
    </g>

    <!-- Attrib 4: Production Form -->
    <g transform="translate(400, 220)">
      <rect width="380" height="68" rx="8" fill="#0D111A" stroke="#1D2436" stroke-width="1"/>
      <text x="18" y="24" fill="#64748B" class="id-mono" font-size="10" letter-spacing="1.5">MISSION READINESS</text>
      <text x="18" y="48" fill="#00E676" class="id-mono" font-size="13">99.99% Uptime · p99 &lt; 42ms · 0 Bloat</text>
      <path d="M 0 0 L 0 68" stroke="#00E676" stroke-width="3"/>
    </g>

    <!-- DIGITAL BARCODE & TELEMETRY SIGNATURE WITH ANIMATED LASER SCANNER -->
    <g transform="translate(0, 310)">
      <rect width="780" height="70" rx="8" fill="#090C12" stroke="#181F2E" stroke-width="1"/>
      
      <!-- Faux Barcode Lines -->
      <g transform="translate(24, 18)" fill="#E2B755" opacity="0.8">
        <rect x="0" y="0" width="3" height="34"/>
        <rect x="5" y="0" width="1" height="34"/>
        <rect x="8" y="0" width="4" height="34"/>
        <rect x="14" y="0" width="2" height="34"/>
        <rect x="18" y="0" width="5" height="34"/>
        <rect x="25" y="0" width="2" height="34"/>
        <rect x="29" y="0" width="1" height="34"/>
        <rect x="33" y="0" width="4" height="34"/>
        <rect x="40" y="0" width="2" height="34"/>
        <rect x="44" y="0" width="5" height="34"/>
        <rect x="52" y="0" width="2" height="34"/>
        <rect x="56" y="0" width="3" height="34"/>
        <rect x="62" y="0" width="1" height="34"/>
        <rect x="65" y="0" width="6" height="34"/>
        <rect x="73" y="0" width="2" height="34"/>
        <rect x="78" y="0" width="3" height="34"/>
        <rect x="83" y="0" width="1" height="34"/>
        <rect x="86" y="0" width="4" height="34"/>
        <rect x="93" y="0" width="2" height="34"/>
        <rect x="98" y="0" width="5" height="34"/>
        <rect x="106" y="0" width="2" height="34"/>
        <rect x="110" y="0" width="4" height="34"/>
      </g>

      <!-- LIVE ANIMATED RED LASER SCANNER BEAM -->
      <line x1="20" y1="18" x2="142" y2="18" stroke="#FF384D" stroke-width="2" opacity="0.9" filter="url(#laserGlow)">
        <animate attributeName="y1" values="18;52;18" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="18;52;18" dur="2.4s" repeatCount="indefinite"/>
      </line>

      <!-- 007 Signature Hash & Credentials with VK18 Easter Egg -->
      <text x="160" y="32" fill="#718096" class="id-mono" font-size="10">MANTRA: 1% CHANCE // 100% BELIEF · SHA-256: VK18-007-8A7F4B92...VERIFIED</text>
      <text x="160" y="48" fill="#CBD5E1" class="id-mono" font-size="11">ISSUED BY: MI6 / Q-BRANCH · CHINNASWAMY PAVILION NODE · BENGALURU</text>
      
      <!-- Right Double-O Stamp with Glowing Border Pulse -->
      <g transform="translate(635, 16)">
        <rect width="125" height="38" rx="4" fill="#1C0D12" stroke="#D31427" stroke-width="1.2">
          <animate attributeName="stroke" values="#D31427;#FF4D61;#D31427" dur="2s" repeatCount="indefinite"/>
        </rect>
        <text x="62" y="24" text-anchor="middle" fill="#FF4D61" class="id-mono" font-size="11" letter-spacing="1">007 // PLAY BOLD</text>
      </g>
    </g>
  </g>
</svg>
