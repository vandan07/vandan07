<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="50%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>

    <!-- RCB Crimson Gradient with Live Sweep Animation -->
    <linearGradient id="liveRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D31427">
        <animate attributeName="stop-color" values="#D31427;#FF3B50;#D31427" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF384D">
        <animate attributeName="stop-color" values="#FF384D;#D31427;#FF384D" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Royal Gold Gradient -->
    <linearGradient id="liveGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755">
        <animate attributeName="stop-color" values="#E2B755;#FFF0C2;#E2B755" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Stadium Grid Pattern -->
    <pattern id="stadiumGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04"/>
      <circle cx="12" cy="12" r="0.6" fill="#E2B755" fill-opacity="0.08"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 700; }
  </style>

  <!-- Base Plate -->
  <rect width="1200" height="420" rx="16" fill="url(#heroBg)"/>
  <rect width="1200" height="420" rx="16" fill="url(#stadiumGrid)"/>

  <!-- Outer Architectural Framing -->
  <rect x="12" y="12" width="1176" height="396" rx="12" fill="none" stroke="#1F2636" stroke-width="1.2"/>
  <rect x="18" y="18" width="1164" height="384" rx="10" fill="none" stroke="#E2B755" stroke-width="0.8" stroke-dasharray="10 8" stroke-opacity="0.25"/>

  <!-- ANIMATED STADIUM FLOODLIGHT 1: Crimson Top Right Pulsing -->
  <circle cx="1060" cy="50" r="240" fill="#D31427" opacity="0.2" filter="url(#glowRed)">
    <animate attributeName="r" values="210;270;210" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- ANIMATED STADIUM FLOODLIGHT 2: Royal Gold Bottom Left Pulsing -->
  <circle cx="120" cy="370" r="200" fill="#E2B755" opacity="0.12" filter="url(#glowGold)">
    <animate attributeName="r" values="180;230;180" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- TOP STATUS BAR -->
  <g transform="translate(48, 45)">
    <!-- Live Match Status Pill -->
    <rect width="250" height="32" rx="16" fill="#121724" stroke="#252F44" stroke-width="1"/>
    <!-- Animated Pulsing Green Beacon -->
    <circle cx="20" cy="16" r="5" fill="#00E676">
      <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="21" fill="#8C98AD" class="font-mono" font-size="11" letter-spacing="1.5">MATCH STATUS: <tspan fill="#00E676">IN THE MIDDLE</tspan></text>
  </g>

  <!-- Cap and Location Badge -->
  <g transform="translate(940, 45)">
    <rect width="212" height="32" rx="6" fill="#1C0D12" stroke="#D31427" stroke-width="1"/>
    <text x="18" y="21" fill="#E2B755" class="font-mono" font-size="11" letter-spacing="2">CAP: #01 // BLR (IN)</text>
  </g>

  <!-- RIGHT SIDE: ANIMATED CRICKET SEAM & ROTATING CREST -->
  <g transform="translate(940, 230)">
    <!-- Rotating Outer Stadium Ring -->
    <circle cx="60" cy="0" r="105" fill="none" stroke="#D31427" stroke-width="1.2" stroke-dasharray="14 10" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0 60 0" to="360 60 0" dur="20s" repeatCount="indefinite"/>
    </circle>

    <!-- Rotating Inner Gold Ring (Opposite Direction) -->
    <circle cx="60" cy="0" r="85" fill="none" stroke="#E2B755" stroke-width="1" stroke-dasharray="8 6" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="360 60 0" to="0 60 0" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- Inner Core with Animated Breathing Glow -->
    <circle cx="60" cy="0" r="62" fill="#141824" stroke="#D31427" stroke-width="2">
      <animate attributeName="stroke" values="#D31427;#E2B755;#D31427" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Monogram Initial VM -->
    <text x="60" y="14" text-anchor="middle" fill="#FFFFFF" class="font-sans" font-size="40" letter-spacing="2">VM</text>

    <!-- Coordinates Label -->
    <text x="60" y="130" text-anchor="middle" fill="#718096" class="font-mono" font-size="9" letter-spacing="2">12.9784° N · 77.5994° E</text>
    <text x="60" y="144" text-anchor="middle" fill="#D31427" class="font-mono" font-size="9" letter-spacing="1">M. CHINNASWAMY</text>
  </g>

  <!-- HERO TITLE & IDENTITY -->
  <g transform="translate(48, 150)">
    <text x="0" y="0" fill="#FFFFFF" class="font-sans" font-size="52" letter-spacing="-0.5">
      VANDAN MAHAJAN
    </text>

    <!-- Subtitle with Crimson Bar -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="4" height="26" fill="url(#liveRed)"/>
      <text x="16" y="20" fill="url(#liveGold)" class="font-sans" font-size="20" letter-spacing="4">
        SOFTWARE ENGINEER · SYSTEMS × PRODUCT × AI
      </text>
    </g>

    <!-- Core Philosophy Ticker Banner -->
    <g transform="translate(0, 80)">
      <rect width="780" height="60" rx="8" fill="#10141F" stroke="#1F283C" stroke-width="1.2"/>
      <path d="M 0 0 L 0 60" stroke="#D31427" stroke-width="4"/>
      
      <!-- Live Scanning Light Beam across the banner -->
      <line x1="0" y1="59" x2="160" y2="59" stroke="#E2B755" stroke-width="2">
        <animate attributeName="x1" values="0;620;0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="160;780;160" dur="4s" repeatCount="indefinite"/>
      </line>

      <text x="24" y="25" fill="#E2B755" class="font-mono" font-size="11" letter-spacing="2">
        CORE ENGINEERING CREDO:
      </text>
      <text x="24" y="45" fill="#CBD5E1" class="font-mono" font-size="13">
        READ THE PITCH <tspan fill="#D31427">→</tspan> UNDERSTAND THE SITUATION <tspan fill="#D31427">→</tspan> <tspan fill="#E2B755">EXECUTE BOLD</tspan>
      </text>
    </g>
  </g>

  <!-- BOTTOM 4 PILLARS (Clean Focus: Identity & Core Stack) -->
  <g transform="translate(48, 335)">
    <!-- Box 1: Core Stack -->
    <g transform="translate(0, 0)">
      <rect width="265" height="46" rx="6" fill="#0F131D" stroke="#222B3D" stroke-width="1"/>
      <text x="16" y="18" fill="#64748B" class="font-mono" font-size="9" letter-spacing="1">PRIMARY STACK</text>
      <text x="16" y="34" fill="#FFFFFF" class="font-mono" font-size="12">JAVA · SPRING · DISTRIBUTED</text>
      <rect x="253" y="0" width="12" height="46" rx="0" fill="#D31427" opacity="0.8"/>
    </g>

    <!-- Box 2: Modern Edge -->
    <g transform="translate(285, 0)">
      <rect width="265" height="46" rx="6" fill="#0F131D" stroke="#222B3D" stroke-width="1"/>
      <text x="16" y="18" fill="#64748B" class="font-mono" font-size="9" letter-spacing="1">INTELLIGENCE SUITE</text>
      <text x="16" y="34" fill="#FFFFFF" class="font-mono" font-size="12">GENAI · RAG · VECTOR DBS</text>
      <rect x="253" y="0" width="12" height="46" rx="0" fill="#E2B755" opacity="0.8"/>
    </g>

    <!-- Box 3: Mindset Formula -->
    <g transform="translate(570, 0)">
      <rect width="320" height="46" rx="6" fill="#0F131D" stroke="#222B3D" stroke-width="1"/>
      <text x="16" y="18" fill="#64748B" class="font-mono" font-size="9" letter-spacing="1">THE SUPERPOWER</text>
      <text x="16" y="34" fill="#E2B755" class="font-mono" font-size="12">LOGIC × REASONING × JUDGMENT</text>
    </g>

    <!-- Box 4: Motto -->
    <g transform="translate(910, 0)">
      <rect width="242" height="46" rx="6" fill="#1C0D12" stroke="#D31427" stroke-width="1.2"/>
      <text x="16" y="18" fill="#FF4D61" class="font-mono" font-size="9" letter-spacing="1">MATCH CALLOUT</text>
      <text x="16" y="34" fill="#FFFFFF" class="font-sans" font-size="12" letter-spacing="1">PLAY BOLD. THINK FIRST.</text>
    </g>
  </g>
</svg>
